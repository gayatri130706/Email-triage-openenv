name: email-triage-env
version: "1.0.0"
description: >
  A real-world OpenEnv environment where AI agents triage business emails —
  assigning priority, category labels, reply flags, and executive summaries.
  Three tasks: easy (priority only) → medium (full triage) → hard (triage + summarize).
author: openenv-submission
license: MIT
tags:
  - openenv
  - email
  - triage
  - nlp
  - productivity
  - real-world

tasks:
  - name: basic_triage
    display_name: "Basic Email Triage"
    difficulty: easy
    max_steps: 5
    description: "Classify 5 emails by priority (urgent/high/normal/low/spam). Partial credit for adjacent levels."

  - name: full_triage
    display_name: "Full Email Triage"
    difficulty: medium
    max_steps: 8
    description: "Triage 8 emails: priority (50%) + category label (30%) + reply flag (20%)."

  - name: triage_and_summarize
    display_name: "Triage and Summarize"
    difficulty: hard
    max_steps: 10
    description: "Triage 10 emails: priority (40%) + label (20%) + reply (20%) + 1-sentence summary (20%)."

observation_space:
  type: object
  fields:
    emails: "List[Email] — id, subject, sender, body, timestamp, labels_existing"
    current_step: "int — steps completed (0 at reset)"
    total_emails: "int — total emails this episode"
    task_name: "str — active task identifier"
    task_description: "str — natural language goal"
    triaged_ids: "List[str] — already-triaged email IDs"
    remaining_ids: "List[str] — not-yet-triaged email IDs"
    inbox_metadata: "dict — difficulty, required fields, reward weights"

action_space:
  type: object
  fields:
    email_id: "str (required) — ID of email being triaged"
    priority: "str (required) — urgent|high|normal|low|spam"
    label: "str (optional) — billing|support|infrastructure|sales|hr|other"
    reply_needed: "bool (optional, default false)"
    summary: "str (optional) — 1-sentence summary, 10-40 words (hard task)"

reward:
  type: dense
  range: [0.0, 1.0]
  per_step: true
  description: >
    Per-step reward in [0,1]. Priority uses graduated partial credit (adjacent = 0.5).
    Label: exact=1.0, valid-but-wrong=0.25, missing=0.0. Reply: binary.
    Summary: heuristic (length + keyword overlap + domain terms).
    Episode score = mean of step rewards.

api:
  endpoints:
    reset:  {method: POST, path: /reset}
    step:   {method: POST, path: /step}
    state:  {method: GET,  path: /state}
    health: {method: GET,  path: /health}
    tasks:  {method: GET,  path: /tasks}

docker:
  port: 7860
  build: "docker build -t email-triage-env ."
  run: "docker run -p 7860:7860 email-triage-env"
